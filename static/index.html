<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>课程反馈工作台</title>
<style>
:root{--ink:#16231d;--muted:#69766f;--paper:#f5f2e9;--card:#fffdf8;--green:#1e6048;--green2:#dcebe2;--gold:#c78b2d;--red:#a73a32;--line:#d8d7ce;--shadow:0 12px 34px #1e3b2b16}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#edf2eb 0,#f8f3e7 55%,#eef1ea 100%);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}.top{background:#173c30;color:#fff;padding:20px 34px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 3px 15px #0002}.brand h1{font-size:23px;margin:0;letter-spacing:.08em}.brand p{margin:3px 0 0;color:#c9ddd4;font-size:13px}.status{display:flex;gap:10px;align-items:center}.pill{padding:6px 11px;border-radius:999px;background:#ffffff15;font-size:13px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#e4b34d}.dot.ok{background:#68d59d}.shell{max-width:1420px;margin:24px auto;padding:0 22px;display:grid;grid-template-columns:330px 1fr;gap:20px}.card{background:var(--card);border:1px solid #e0ded3;border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.card h2{font-size:17px;margin:0;padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.content{padding:17px}.field{margin-bottom:13px}.field label{display:block;color:#45544c;font-weight:600;margin-bottom:5px;font-size:13px}input,textarea,select{width:100%;border:1px solid #cfd3cc;background:#fff;border-radius:9px;padding:9px 11px;font:inherit;color:var(--ink);outline:none}input:focus,textarea:focus{border-color:#4f876f;box-shadow:0 0 0 3px #4f876f1c}textarea{resize:vertical;min-height:75px}.btn{border:0;border-radius:9px;padding:9px 14px;font:600 14px inherit;cursor:pointer;background:#e7ebe7;color:#284036}.btn:hover{filter:brightness(.97)}.btn.primary{background:var(--green);color:white}.btn.warn{background:#fff1d8;color:#7a4a00;border:1px solid #e7c98e}.btn.danger{background:#fff0ee;color:var(--red);border:1px solid #e9b8b2}.btn.small{padding:6px 9px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.student-list{max-height:610px;overflow:auto}.student{border-bottom:1px solid #ebe9e0;padding:11px 16px}.student:last-child{border:0}.student-head{display:flex;justify-content:space-between;gap:8px}.student-name{font-weight:700}.student small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.check{width:auto;margin-right:7px}.muted{color:var(--muted)}.main{display:flex;flex-direction:column;gap:20px}.course-grid{display:grid;grid-template-columns:180px 1fr;gap:12px}.course-grid .wide{grid-column:1/-1}.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;max-height:310px;overflow:auto;padding:2px}.note{border:1px solid #deddd4;border-radius:10px;padding:10px;background:#fff}.note b{display:flex;justify-content:space-between;margin-bottom:6px}.note textarea{min-height:65px}.toolbar{display:flex;gap:9px;justify-content:space-between;align-items:center;flex-wrap:wrap}.drafts{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:14px;padding:16px}.draft{border:1px solid #deddd4;border-radius:12px;background:#fff;overflow:hidden}.draft.sent{border-color:#8bbca4}.draft.error{border-color:#d68b83}.draft-head{padding:10px 12px;background:#f2f3ee;display:flex;justify-content:space-between;align-items:center}.draft-title{font-weight:700}.tag{font-size:12px;padding:3px 7px;border-radius:99px;background:#e7e9e5}.tag.sent{background:#d8ecdf;color:#1c6542}.tag.error{background:#f9dcd8;color:#8e2f27}.draft textarea{border:0;border-radius:0;min-height:330px;padding:13px;line-height:1.7;box-shadow:none}.draft-actions{padding:10px;border-top:1px solid #eee;display:flex;gap:7px;align-items:center}.draft-actions .selectDraft{width:auto;margin-right:auto}.empty{padding:42px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#10251c99;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.dialog{width:min(520px,100%);background:#fff;border-radius:14px;padding:20px;box-shadow:0 25px 80px #0005}.dialog h3{margin:0 0 15px}.toast{position:fixed;right:24px;bottom:24px;background:#173c30;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);display:none;max-width:450px;z-index:20}.toast.bad{background:#8d302b}.log{font-size:13px;max-height:180px;overflow:auto}.log div{padding:7px 0;border-bottom:1px solid #eee}@media(max-width:850px){.shell{grid-template-columns:1fr}.course-grid{grid-template-columns:1fr}.course-grid .wide{grid-column:auto}.drafts{grid-template-columns:1fr}.top{padding:16px}.status{display:none}}
</style></head>
<body>
<header class="top"><div class="brand"><h1>课程反馈工作台</h1><p>批量生成 · 人工审核 · 微信精准投递</p></div><div class="status"><span class="pill"><span id="wxDot" class="dot"></span><span id="wxText">检查微信中</span></span><span class="pill">本机模式 127.0.0.1</span></div></header>
<div class="shell">
<aside class="card"><h2><span>学生与微信群</span><button class="btn small primary" onclick="openStudent()">＋ 添加</button></h2><div id="studentList" class="student-list"></div></aside>
<main class="main">
<section class="card"><h2><span>本周课程</span><span class="muted" style="font-size:12px">课程只需填写一次</span></h2><div class="content">
<div class="course-grid"><div class="field"><label>周次/日期</label><input id="label" placeholder="例如：2026年第45周"></div><div class="field"><label>课程概述</label><input id="intro" placeholder="例如：本节课主要预习动量与磁场相关知识"></div><div class="field wide"><label>知识点（每行一个）</label><textarea id="topics" placeholder="动量守恒\n人船模型\n流体类动量定理"></textarea></div></div>
<div class="field"><label>每位学生的课堂观察</label><div id="notesGrid" class="notes-grid"></div></div>
<div class="toolbar"><span class="muted">未填写时使用学生的默认观察</span><button id="generateBtn" class="btn primary" onclick="generateAll()">生成选中学生反馈</button></div>
</div></section>
<section class="card"><h2><span>反馈草稿</span><span id="draftCount" class="muted" style="font-size:12px"></span></h2><div class="content toolbar"><div><button class="btn" onclick="selectAll(true)">全选</button> <button class="btn" onclick="selectAll(false)">取消</button></div><div><button class="btn warn" onclick="prepareSelected()">写入第一条草稿（不发送）</button> <button class="btn danger" onclick="sendSelected()">发送选中反馈</button></div></div><div id="drafts" class="drafts"></div></section>
<section class="card"><h2>最近操作</h2><div id="logs" class="content log"></div></section>
</main></div>
<div id="studentModal" class="modal"><div class="dialog"><h3 id="studentDialogTitle">添加学生</h3><input type="hidden" id="sid"><div class="row"><div class="field"><label>学生姓名</label><input id="sname"></div><div class="field"><label>年级</label><input id="sgrade" placeholder="高一/高二/高三"></div></div><div class="field"><label>微信会话/群聊的准确名称</label><input id="schat"></div><div class="field"><label>默认课堂观察</label><textarea id="snotes" placeholder="例如：听课认真，物理思维好，但发挥不稳定"></textarea></div><div class="toolbar"><button class="btn" onclick="closeStudent()">取消</button><button class="btn primary" onclick="saveStudent()">保存</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
let state={students:[],drafts:[],logs:[]};
const $=id=>document.getElementById(id);
async function api(path,opt={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json();if(!r.ok)throw new Error(d.error||d.detail||'操作失败');return d}
function toast(msg,bad=false){const t=$('toast');t.textContent=msg;t.className='toast'+(bad?' bad':'');t.style.display='block';setTimeout(()=>t.style.display='none',4200)}
async function refresh(){try{const d=await api('/api/state');state=d;render();$('wxDot').className='dot'+(d.wechat.ok?' ok':'');$('wxText').textContent=d.wechat.ok?'微信已就绪':(d.wechat.error||'微信未就绪')}catch(e){toast(e.message,true)}}
function render(){renderStudents();renderDrafts();renderLogs()}
function renderStudents(){const active=state.students.filter(s=>s.active);$('studentList').innerHTML=state.students.length?state.students.map(s=>`<div class="student"><div class="student-head"><label><input class="check studentCheck" type="checkbox" data-id="${s.id}" ${s.active?'checked':''}><span class="student-name">${esc(s.name)}</span> <span class="muted">${esc(s.grade)}</span></label><button class="btn small" onclick="editStudent(${s.id})">编辑</button></div><small title="${esc(s.chat_title)}">微信：${esc(s.chat_title)}</small><small title="${esc(s.default_notes)}">默认观察：${esc(s.default_notes||'未设置')}</small></div>`).join(''):'<div class="empty">先添加学生与微信群</div>';$('notesGrid').innerHTML=active.map(s=>`<div class="note"><b><span>${esc(s.name)}</span><span class="muted">${esc(s.grade)}</span></b><textarea id="note-${s.id}" placeholder="${esc(s.default_notes||'填写本周课堂表现')}"></textarea></div>`).join('')}
function statusName(s){return {draft:'待审核',prepared:'已写入未发送',sent:'已发送',error:'失败'}[s]||s}
function renderDrafts(){const ds=state.drafts;$('draftCount').textContent=`共 ${ds.length} 条`;$('drafts').innerHTML=ds.length?ds.map(d=>`<article class="draft ${d.status}"><div class="draft-head"><div><span class="draft-title">${esc(d.name)}</span> <span class="muted">→ ${esc(d.chat_title)}</span></div><span class="tag ${d.status}">${statusName(d.status)}</span></div><textarea id="draft-${d.id}">${esc(d.content)}</textarea>${d.error?`<div style="padding:0 12px;color:#a73a32">${esc(d.error)}</div>`:''}<div class="draft-actions"><input class="selectDraft" type="checkbox" value="${d.id}" ${d.status==='sent'?'':'checked'}><button class="btn small" onclick="saveDraft(${d.id})">保存修改</button><button class="btn small warn" onclick="prepareOne(${d.id})">写入微信</button><button class="btn small danger" onclick="sendOne(${d.id})" ${d.status==='sent'?'disabled':''}>发送</button></div></article>`).join(''):'<div class="empty">填写本周课程和课堂观察后生成反馈</div>'}
function renderLogs(){$('logs').innerHTML=state.logs.length?state.logs.map(l=>`<div><b>${esc(l.name)}</b> · ${esc(l.action)} · ${esc(l.created_at)}</div>`).join(''):'暂无操作记录'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openStudent(s={}){$('sid').value=s.id||'';$('sname').value=s.name||'';$('sgrade').value=s.grade||'';$('schat').value=s.chat_title||'';$('snotes').value=s.default_notes||'';$('studentDialogTitle').textContent=s.id?'编辑学生':'添加学生';$('studentModal').classList.add('show')}
function closeStudent(){$('studentModal').classList.remove('show')}
function editStudent(id){openStudent(state.students.find(s=>s.id===id))}
async function saveStudent(){try{await api('/api/students',{method:'POST',body:JSON.stringify({id:$('sid').value||null,name:$('sname').value,grade:$('sgrade').value,chat_title:$('schat').value,default_notes:$('snotes').value})});closeStudent();toast('学生信息已保存');refresh()}catch(e){toast(e.message,true)}}
async function generateAll(){const ids=[...document.querySelectorAll('.studentCheck:checked')].map(x=>+x.dataset.id);const notes={};ids.forEach(id=>notes[id]=$(`note-${id}`)?.value||'');if(!ids.length)return toast('请至少选择一名学生',true);$('generateBtn').disabled=true;try{const d=await api('/api/generate',{method:'POST',body:JSON.stringify({label:$('label').value,course_intro:$('intro').value,topics:$('topics').value,student_ids:ids,student_notes:notes})});toast(`已生成 ${d.count} 条反馈`);await refresh()}catch(e){toast(e.message,true)}finally{$('generateBtn').disabled=false}}
async function saveDraft(id){try{await api(`/api/drafts/${id}`,{method:'POST',body:JSON.stringify({content:$(`draft-${id}`).value})});toast('草稿已保存');refresh()}catch(e){toast(e.message,true)}}
async function prepareOne(id){if(!confirm('只把这条反馈写入对应微信输入框，不会发送。继续吗？'))return;try{await saveDraft(id);const d=await api(`/api/drafts/${id}/prepare`,{method:'POST',body:'{}'});toast(d.ok?'已写入微信输入框':'写入失败',!d.ok);refresh()}catch(e){toast(e.message,true)}}
async function sendOne(id){if(prompt('即将真实发送微信消息。请输入：确认发送')!=='确认发送')return toast('已取消发送');try{await saveDraft(id);const d=await api(`/api/drafts/${id}/send`,{method:'POST',body:JSON.stringify({confirmation:'确认发送'})});toast(d.ok?'发送成功':'发送失败',!d.ok);refresh()}catch(e){toast(e.message,true)}}
function selected(){return [...document.querySelectorAll('.selectDraft:checked')].map(x=>+x.value)}
function selectAll(v){document.querySelectorAll('.selectDraft:not(:disabled)').forEach(x=>x.checked=v)}
async function prepareSelected(){const ids=selected();if(!ids.length)return toast('没有选中草稿',true);await prepareOne(ids[0])}
async function sendSelected(){const ids=selected();if(!ids.length)return toast('没有选中草稿',true);if(prompt(`即将依次发送 ${ids.length} 条微信消息。请输入：确认发送`)!=='确认发送')return toast('已取消发送');try{for(const id of ids)await saveDraft(id);const d=await api('/api/send-batch',{method:'POST',body:JSON.stringify({draft_ids:ids,confirmation:'确认发送'})});const ok=d.results.filter(x=>x.ok).length;toast(`发送完成：成功 ${ok}，失败/跳过 ${d.results.length-ok}`,ok!==d.results.length);refresh()}catch(e){toast(e.message,true)}}
refresh();
</script></body></html>
