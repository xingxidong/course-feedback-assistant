<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>课评助手</title>

<style>
/* 教务桌面视觉层：克制、清晰，保留原有交互结构 */
:root{--ink:#202124;--muted:#6b7078;--paper:#f6f7f8;--card:#fff;--green:#247451;--green2:#eaf4ee;--gold:#9a6816;--red:#b23b36;--line:#e4e6e8;--line-strong:#d5d8dc;--shadow:0 1px 2px rgba(20,24,28,.04),0 6px 20px rgba(20,24,28,.035)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit}
.top{height:64px;padding:0 32px;background:#fff;color:var(--ink);border-bottom:1px solid var(--line);box-shadow:none;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:8}
.brand{display:flex;align-items:baseline;gap:14px}.brand h1{margin:0;font-size:17px;font-weight:650;letter-spacing:0}.brand p{margin:0;color:var(--muted);font-size:12px}.status{display:flex;align-items:center;gap:8px}.pill{padding:5px 9px;border:1px solid var(--line);border-radius:5px;background:#fafafa;color:#5f646b;font-size:12px}.dot{width:7px;height:7px;margin-right:6px;background:#d29b3d}.dot.ok{background:#3e9c6c}
.shell{width:100%;max-width:1500px;margin:0 auto;padding:24px 28px 40px;display:grid;grid-template-columns:292px minmax(0,1fr);gap:20px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}.card h2{min-height:54px;margin:0;padding:13px 16px;border-bottom:1px solid var(--line);font-size:15px;font-weight:650;display:flex;align-items:center;justify-content:space-between;gap:16px}.section-title{display:flex;align-items:center;gap:10px}.step{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:4px;background:#f0f1f2;color:#5f646b;font-size:11px;font-weight:700}.section-meta{color:var(--muted);font-size:12px;font-weight:400}.content{padding:18px}.main{display:flex;flex-direction:column;gap:16px;min-width:0}.roster{position:sticky;top:88px}.roster h2{padding-right:10px}.student-list{max-height:calc(100vh - 166px);overflow:auto}
.field{margin-bottom:15px}.field label{display:block;margin-bottom:6px;color:#454a50;font-size:12px;font-weight:600}input,textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:5px;background:#fff;color:var(--ink);font:inherit;outline:none;transition:border-color .15s,box-shadow .15s}input::placeholder,textarea::placeholder{color:#a3a7ac}input:focus,textarea:focus{border-color:#6c917e;box-shadow:0 0 0 2px rgba(36,116,81,.10)}textarea{min-height:76px;resize:vertical}.course-grid{display:grid;grid-template-columns:190px minmax(0,1fr);gap:0 14px}.course-grid .wide{grid-column:1/-1}.field-heading{display:flex;align-items:baseline;justify-content:space-between;margin:1px 0 8px}.field-heading label{font-size:12px;font-weight:600;color:#454a50}.field-help{font-size:12px;color:var(--muted)}
.btn{min-height:32px;padding:6px 11px;border:1px solid var(--line-strong);border-radius:5px;background:#fff;color:#3e4349;font:500 13px/1.3 inherit;cursor:pointer;box-shadow:0 1px 1px rgba(20,24,28,.03)}.btn:hover{background:#f7f8f8;filter:none}.btn:active{background:#f0f1f2}.btn.primary{border-color:#247451;background:#247451;color:#fff}.btn.primary:hover{background:#1e6546}.btn.warn{border-color:#dfc999;background:#fffbf2;color:#80560f}.btn.warn:hover{background:#fbf4e4}.btn.danger{border-color:#dfb6b3;background:#fff8f7;color:#a43732}.btn.danger:hover{background:#fceeed}.btn.small{min-height:28px;padding:4px 8px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;gap:12px;align-items:center}.row>*{flex:1}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.action-bar{margin:4px -18px -18px;padding:12px 18px;background:#fafafa;border-top:1px solid var(--line)}
.student{padding:12px 14px;border-bottom:1px solid #eceeef}.student:last-child{border-bottom:0}.student:hover{background:#fafbfb}.student-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.student-head label{min-width:0;display:flex;align-items:center}.student-name{font-weight:600}.student small{display:block;margin:3px 0 0 23px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}.check{width:14px;height:14px;margin:0 8px 0 0;accent-color:var(--green)}.muted{color:var(--muted)}
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;max-height:304px;overflow:auto;padding:1px}.note{padding:10px;border:1px solid var(--line);border-radius:6px;background:#fcfcfc}.note b{display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px}.note textarea{min-height:66px;background:#fff}
.draft-toolbar{padding:11px 16px;border-bottom:1px solid var(--line);background:#fafafa}.drafts{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:12px;padding:14px}.draft{overflow:hidden;border:1px solid var(--line-strong);border-radius:6px;background:#fff}.draft.sent{border-color:#9fc7af}.draft.error{border-color:#dba6a2}.draft-head{padding:9px 11px;border-bottom:1px solid var(--line);background:#fafafa;display:flex;justify-content:space-between;align-items:center;gap:10px}.draft-title{font-weight:600}.tag{padding:2px 6px;border-radius:4px;background:#eceeef;color:#5d6268;font-size:11px;white-space:nowrap}.tag.prepared{background:#f7edd7;color:#80560f}.tag.sent{background:#e4f2e9;color:#246946}.tag.uncertain{background:#fff0d8;color:#8a5b00}.tag.error{background:#f8e5e3;color:#9d3530}.draft textarea{min-height:310px;padding:12px;border:0;border-radius:0;box-shadow:none;line-height:1.72}.draft-actions{padding:9px 10px;border-top:1px solid var(--line);background:#fafafa;display:flex;gap:6px;align-items:center}.draft-actions .selectDraft{width:14px;height:14px;margin:0 auto 0 0;accent-color:var(--green)}.empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:13px}
.log{max-height:180px;overflow:auto;font-size:12px}.log div{padding:7px 0;border-bottom:1px solid #eef0f1}.log div:last-child{border-bottom:0}.modal{position:fixed;inset:0;z-index:10;padding:20px;background:rgba(25,29,33,.46);display:none;align-items:center;justify-content:center}.modal.show{display:flex}.dialog{width:min(520px,100%);padding:20px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 20px 60px rgba(15,20,24,.22)}.dialog h3{margin:0 -20px 18px;padding:0 20px 15px;border-bottom:1px solid var(--line);font-size:16px}.dialog .toolbar{margin:4px -20px -20px;padding:12px 20px;border-top:1px solid var(--line);background:#fafafa;justify-content:flex-end}.toast{position:fixed;right:24px;bottom:24px;z-index:20;display:none;max-width:450px;padding:10px 14px;border-radius:5px;background:#26342e;color:#fff;box-shadow:0 8px 28px rgba(20,24,28,.18);font-size:13px}.toast.bad{background:#963833}
@media(max-width:900px){.top{padding:0 18px}.brand p,.status .pill:last-child{display:none}.shell{grid-template-columns:1fr;padding:16px}.roster{position:static}.student-list{max-height:360px}.course-grid{grid-template-columns:1fr}.course-grid .wide{grid-column:auto}.drafts{grid-template-columns:1fr}}
@media(max-width:560px){.status{display:none}.shell{padding:10px}.content{padding:14px}.action-bar{margin:4px -14px -14px;padding:11px 14px}.row{display:block}.drafts{padding:10px}.draft-actions{flex-wrap:wrap}}
</style>
<style>
/* 最终视觉层：校内业务工具风格，覆盖旧版表现 */
:root{--bg:#f5f6f7;--panel:#fff;--subtle:#f8f9fa;--hover:#f2f4f5;--text:#202124;--muted:#6f757d;--faint:#9aa0a6;--border:#dfe2e5;--border-strong:#c9cdd2;--primary:#246b58;--primary-hover:#1d5949;--success:#2f7655;--warning:#8b641c;--danger:#b33a32}
html,body{background:#f5f6f7}
body{color:var(--text);font-size:14px}
.top{height:52px;padding:0 24px;background:#fff;color:var(--text);border-bottom:1px solid var(--border);box-shadow:none}
.brand{gap:14px}.brand h1{font-size:17px;font-weight:600;letter-spacing:0}.brand p{color:var(--muted);font-size:12px}
.status{gap:18px;color:var(--muted);font-size:12px}.pill{padding:0;border:0;border-radius:0;background:transparent;color:var(--muted)}.dot{width:7px;height:7px;margin-right:7px}.dot.ok{background:#3f9068}
.shell{max-width:1560px;margin:0 auto;padding:16px 20px 28px;grid-template-columns:280px minmax(0,1fr);gap:16px}
.main{gap:12px}.card{border:1px solid var(--border);border-radius:5px;box-shadow:none}.card h2{min-height:44px;padding:10px 14px;font-size:14px;font-weight:600}.content{padding:14px}.section-title{gap:8px}.step{display:inline;width:auto;height:auto;background:none;color:var(--faint);font-size:11px;font-weight:500;border-radius:0}.section-meta{font-size:12px}.roster{top:68px}.student-list{max-height:calc(100vh - 124px)}
.student{padding:10px 12px}.student:hover{background:var(--subtle)}.student-name{font-weight:600}.student small{margin-top:2px;font-size:11px}.student-actions{display:flex;gap:4px}
.field{margin-bottom:12px}.field label,.field-heading label{margin-bottom:4px;font-weight:500}.field-heading{margin:2px 0 7px}
input,textarea,select{min-height:34px;padding:6px 9px;border:1px solid var(--border-strong);border-radius:4px;box-shadow:none}input:hover,textarea:hover{border-color:#aeb4bb}input:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(36,107,88,.13)}textarea{line-height:1.6}
.course-grid{gap:0 12px}.notes-grid{gap:0 12px;max-height:300px;padding:0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}.note{padding:10px 0;border:0;border-bottom:1px solid #eef0f1;border-radius:0;background:transparent}.note textarea{min-height:64px}
.btn{min-height:32px;padding:6px 11px;border:1px solid var(--border-strong);border-radius:4px;background:#fff;color:#3f444a;font-weight:500;box-shadow:none}.btn:hover{background:var(--hover);filter:none}.btn.primary{border-color:var(--primary);background:var(--primary)}.btn.primary:hover{background:var(--primary-hover)}.btn.warn{border-color:var(--border-strong);background:#fff;color:#4a4f55}.btn.warn:hover{background:var(--hover)}.btn.danger{border-color:#d9a9a5;background:#fff;color:var(--danger)}.btn.danger:hover{background:#fff4f3}.btn.small{min-height:27px;padding:4px 8px}.action-bar{margin:3px -14px -14px;padding:10px 14px;background:var(--subtle)}
.draft-toolbar{padding:9px 14px;background:var(--subtle);position:sticky;top:52px;z-index:4}.drafts{display:block;padding:0}.draft,.draft.sent,.draft.error{border:0;border-bottom:1px solid var(--border);border-radius:0;background:#fff}.draft:last-child{border-bottom:0}.draft-head{padding:9px 14px;border:0;background:#fff}.tag{padding:2px 6px;border-radius:3px;font-size:11px}.draft textarea{width:calc(100% - 28px);min-height:145px;margin:0 14px 10px;padding:9px 10px;border:1px solid var(--border);border-radius:4px}.draft-actions{padding:8px 14px;background:var(--subtle);justify-content:flex-end}.empty{padding:28px 16px;text-align:left}
.modal{background:rgba(20,24,28,.42)}.dialog{border-radius:7px;box-shadow:0 14px 42px rgba(15,20,24,.18)}
.toast{right:20px;top:66px;bottom:auto;max-width:360px;padding:9px 12px;border:1px solid var(--border);border-left:3px solid var(--success);border-radius:4px;background:#fff;color:var(--text);box-shadow:0 5px 16px rgba(20,24,28,.12)}.toast.bad{background:#fff;color:var(--text);border-left-color:var(--danger)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:none;box-shadow:0 0 0 2px rgba(36,107,88,.16)}
.student-choices{display:flex;flex-wrap:wrap;gap:7px;padding:9px 0 12px;border-bottom:1px solid var(--border)}.student-choice{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:4px 9px;border:1px solid var(--border-strong);border-radius:4px;background:#fff;cursor:pointer;user-select:none}.student-choice:hover{background:var(--hover)}.student-choice:has(input:checked){border-color:#7ba392;background:#edf5f1;color:#174f40}.student-choice input{width:14px;height:14px;min-height:0;margin:0;accent-color:var(--primary)}.student-choice small{color:var(--muted)}.observation-heading{margin-top:12px}.note.is-hidden{display:none}.text-btn{padding:0 5px;border:0;background:transparent;color:var(--primary);font-size:12px;cursor:pointer}.text-btn:hover{text-decoration:underline}
@media(max-width:960px){.shell{grid-template-columns:1fr;padding:12px}.roster{position:static}.course-grid{grid-template-columns:1fr}.course-grid .wide{grid-column:auto}.draft-toolbar{top:52px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<header class="top">
  <div class="brand"><h1>课评助手</h1><p>课程整理、反馈审核与微信投递</p></div>
  <div class="status" aria-label="系统状态"><span class="pill"><span id="wxDot" class="dot"></span><span id="wxText">检查微信中</span></span><span class="pill">模型：<span id="modelText">检查中</span></span><span class="pill">仅在本机运行</span></div>
</header>
<div class="shell">
  <aside class="card roster">
    <h2><span>学生与会话</span><button class="btn small primary" onclick="openStudent()">添加学生</button></h2>
    <div id="studentList" class="student-list"></div>
  </aside>
  <main class="main">
    <section class="card">
      <h2><span class="section-title"><span class="step">01</span><span>整理本周课程</span></span><span class="section-meta">课程信息统一填写一次</span></h2>
      <div class="content">
        <div class="course-grid">
          <div class="field"><label>周次 / 日期</label><input id="label" placeholder="例如：2026 年第 45 周"></div>
          <div class="field"><label>课程概述</label><input id="intro" placeholder="简要说明本节课的学习内容与目标"></div>
          <div class="field wide"><label>知识点（每行一项）</label><textarea id="topics" placeholder="例如：动量守恒、人船模型、流体类动量定理；每行填写一个知识点"></textarea></div>
        </div>
        <div class="field-heading"><label>选择本周上课学生</label><span class="field-help"><button class="text-btn" onclick="chooseStudents(true)">全选</button><button class="text-btn" onclick="chooseStudents(false)">清空</button></span></div>
        <div id="studentChoices" class="student-choices"></div>
        <div class="field-heading observation-heading"><label>学生课堂观察</label><span class="field-help">只显示已选学生；留空则采用默认观察</span></div>
        <div id="notesGrid" class="notes-grid"></div>
        <div class="toolbar action-bar"><span id="studentSelectionCount" class="muted">请选择本周上课学生</span><button id="generateBtn" class="btn primary" onclick="generateAll()">生成反馈草稿</button></div>
      </div>
    </section>
    <section class="card">
      <h2><span class="section-title"><span class="step">02</span><span>审核反馈草稿</span></span><span id="draftCount" class="section-meta"></span></h2>
      <div id="drafts" class="drafts"></div>
    </section>
    <section class="card">
      <h2><span class="section-title"><span class="step">03</span><span>最近操作</span></span><span class="section-meta">发送与写入记录</span></h2>
      <div id="logs" class="content log"></div>
    </section>
  </main>
</div>
<div id="studentModal" class="modal"><div class="dialog"><h3 id="studentDialogTitle">添加学生</h3><input type="hidden" id="sid"><div class="row"><div class="field"><label>学生姓名</label><input id="sname" autocomplete="off"></div><div class="field"><label>年级</label><input id="sgrade" placeholder="高一 / 高二 / 高三"></div></div><div class="field"><label>微信会话或群聊的准确名称（可稍后填写）</label><input id="schat" autocomplete="off" placeholder="暂时留空也可以"></div><div class="field"><label>默认课堂观察</label><textarea id="snotes" placeholder="例如：听课认真，物理思维好，但发挥不稳定"></textarea></div><div class="toolbar"><button class="btn" onclick="closeStudent()">取消</button><button class="btn primary" onclick="saveStudent()">保存</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
let state={students:[],drafts:[],logs:[]};
const $=id=>document.getElementById(id);
async function api(path,opt={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json();if(!r.ok)throw new Error(d.detail||d.error||'操作失败');return d}
function toast(msg,bad=false){const t=$('toast');t.textContent=msg;t.className='toast'+(bad?' bad':'');t.style.display='block';setTimeout(()=>t.style.display='none',4200)}
async function refresh(){try{const d=await api('/api/state');state=d;render();$('wxDot').className='dot'+(d.wechat.ok?' ok':'');$('wxText').textContent=d.wechat.ok?'微信已就绪':(d.wechat.detail||d.wechat.error||'微信未就绪');$('modelText').textContent=d.model?.model||'本地规则引擎'}catch(e){toast(e.message,true)}}
function render(){renderStudents();renderDrafts();renderLogs()}
function chatLabel(value){return String(value||'').startsWith('待填写：')?'待填写':value}
function renderStudents(){const active=state.students.filter(s=>s.active);$('studentList').innerHTML=state.students.length?state.students.map(s=>`<div class="student"><div class="student-head"><label><span class="student-name">${esc(s.name)}</span> <span class="muted">${esc(s.grade)}</span></label><span class="student-actions"><button class="btn small" onclick="editStudent(${s.id})">编辑</button><button class="btn small danger" onclick="deleteStudent(${s.id})">删除</button></span></div><small title="${esc(s.chat_title)}">微信：${esc(chatLabel(s.chat_title))}</small><small title="${esc(s.default_notes)}">默认观察：${esc(s.default_notes||'未设置')}</small></div>`).join(''):'<div class="empty">先添加学生与微信群</div>';$('studentChoices').innerHTML=active.length?active.map(s=>`<label class="student-choice"><input type="checkbox" class="studentChoice" data-id="${s.id}" onchange="syncStudentSelection()"><span>${esc(s.name)}</span><small>${esc(s.grade)}</small></label>`).join(''):'<span class="muted">请先在左侧添加学生</span>';$('notesGrid').innerHTML=active.map(s=>`<div class="note" data-student-id="${s.id}"><b><span>${esc(s.name)}</span><span class="muted">${esc(s.grade)}</span></b><textarea id="note-${s.id}" placeholder="${esc(s.default_notes||'填写本周课堂表现')}"></textarea></div>`).join('');syncStudentSelection()}
function syncStudentSelection(){const ids=new Set([...document.querySelectorAll('.studentChoice:checked')].map(x=>+x.dataset.id));document.querySelectorAll('.note[data-student-id]').forEach(n=>n.classList.toggle('is-hidden',!ids.has(+n.dataset.studentId)));const el=$('studentSelectionCount');if(el)el.textContent=ids.size?`已选择 ${ids.size} 名学生，将分别生成反馈`:'请选择本周上课学生'}
function chooseStudents(value){document.querySelectorAll('.studentChoice').forEach(x=>x.checked=value);syncStudentSelection()}
function statusName(s){return {draft:'待审核',prepared:'已写入未发送',sending:'正在发送',sent:'已发送',uncertain:'发送结果待确认',error:'失败'}[s]||s}
function renderDrafts(){const ds=state.drafts;$('draftCount').textContent=`共 ${ds.length} 条`;$('drafts').innerHTML=ds.length?ds.map(d=>`<article class="draft ${d.status}"><div class="draft-head"><div><span class="draft-title">${esc(d.name)}</span> <span class="muted">→ ${esc(chatLabel(d.chat_title))}</span></div><span class="tag ${d.status}">${statusName(d.status)}</span></div><textarea id="draft-${d.id}">${esc(d.content)}</textarea>${d.error?`<div style="padding:0 12px;color:#a73a32">${esc(d.error)}</div>`:''}<div class="draft-actions"><button class="btn small" onclick="saveDraft(${d.id})" ${d.status==='uncertain'?'disabled':''}>保存修改</button><button class="btn small warn" onclick="prepareOne(${d.id})" ${(d.status==='uncertain'||d.chat_title.startsWith('待填写：'))?'disabled title="请先确认发送状态或填写微信会话名称"':''}>写入微信</button><button class="btn small danger" onclick="sendOne(${d.id})" ${(d.status==='sent'||d.status==='uncertain'||d.chat_title.startsWith('待填写：'))?'disabled':''}>发送</button></div></article>`).join(''):'<div class="empty">填写本周课程和课堂观察后生成反馈</div>'}
function renderLogs(){$('logs').innerHTML=state.logs.length?state.logs.map(l=>`<div><b>${esc(l.name)}</b> · ${esc(l.action)} · ${esc(l.created_at)}</div>`).join(''):'暂无操作记录'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openStudent(s={}){$('sid').value=s.id||'';$('sname').value=s.name||'';$('sgrade').value=s.grade||'';$('schat').value=(s.chat_title||'').startsWith('待填写：')?'':(s.chat_title||'');$('snotes').value=s.default_notes||'';$('studentDialogTitle').textContent=s.id?'编辑学生':'添加学生';$('studentModal').classList.add('show')}
function closeStudent(){$('studentModal').classList.remove('show')}
function editStudent(id){openStudent(state.students.find(s=>s.id===id))}
async function deleteStudent(id){const student=state.students.find(s=>s.id===id);if(!student)return;if(!confirm(`确定删除学生“${student.name}”吗？\n历史反馈和发送记录会保留。`))return;try{await api(`/api/students/${id}/delete`,{method:'POST',body:'{}'});toast('学生已删除');refresh()}catch(e){toast(e.message,true)}}
async function saveStudent(){try{await api('/api/students',{method:'POST',body:JSON.stringify({id:$('sid').value||null,name:$('sname').value,grade:$('sgrade').value,chat_title:$('schat').value,default_notes:$('snotes').value})});closeStudent();toast('学生信息已保存');refresh()}catch(e){toast(e.message,true)}}
async function generateAll(){const ids=[...document.querySelectorAll('.studentChoice:checked')].map(x=>+x.dataset.id);const notes={};ids.forEach(id=>notes[id]=$(`note-${id}`)?.value||'');if(!ids.length)return toast('请先选择本周上课学生',true);$('generateBtn').disabled=true;try{const d=await api('/api/generate',{method:'POST',body:JSON.stringify({label:$('label').value,course_intro:$('intro').value,topics:$('topics').value,student_ids:ids,student_notes:notes})});toast(`已生成 ${d.count} 条反馈`);await refresh()}catch(e){toast(e.message,true)}finally{$('generateBtn').disabled=false}}
async function saveDraft(id,{notify=true,refreshAfter=true}={}){try{await api(`/api/drafts/${id}`,{method:'POST',body:JSON.stringify({content:$(`draft-${id}`).value})});if(notify)toast('草稿已保存');if(refreshAfter)await refresh();return true}catch(e){toast(e.message,true);throw e}}
async function prepareOne(id){if(!confirm('只把这条反馈写入对应微信输入框，不会发送。继续吗？'))return;try{await saveDraft(id,{notify:false,refreshAfter:false});const d=await api(`/api/drafts/${id}/prepare`,{method:'POST',body:'{}'});toast(d.ok?'已写入微信输入框':'写入失败',!d.ok);refresh()}catch(e){}}
async function sendOne(id){if(prompt('即将真实发送微信消息。请输入：确认发送')!=='确认发送')return toast('已取消发送');try{await saveDraft(id,{notify:false,refreshAfter:false});const d=await api(`/api/drafts/${id}/send`,{method:'POST',body:JSON.stringify({confirmation:'确认发送'})});toast(d.ok?'发送成功，已从当前列表移除':'发送失败',!d.ok);refresh()}catch(e){}}
refresh();
</script></body></html>
